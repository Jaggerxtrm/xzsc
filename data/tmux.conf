# ============================================
# TMUX CONFIGURATION
# ============================================

# --- TERMINAL & TRUE COLOR ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-overrides ",*:Tc"
# Keep non-interactive tool runners from disabling colors in user panes.
set-environment -gu NO_COLOR

# Keep clipboard/display env fresh for long-lived or restored tmux servers.
# Without WAYLAND_DISPLAY, wl-copy silently fails and mouse selections vanish.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID WINDOWID XAUTHORITY"

# --- GENERAL ---
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g extended-keys on
set -g default-shell ZSHELL_PATH

# --- COPY-PASTE (native OSC 52 + script funnel for GNOME Terminal) ---
# set-clipboard on + the `clipboard` terminal-feature makes tmux itself emit
# OSC 52 (ESC]52;;<base64>) to the attached client on EVERY copy action.
# IMPORTANT: GNOME Terminal/VTE DROPS OSC 52 (verified in VTE source:
# vteseq.cc case VTE_OSC_XTERM_SET_XSELECTION -> default: break), so for
# GNOME Terminal the real delivery path is the script funnel below (X11
# xclip / reverse-tunnel bridge). OSC 52 only works with kitty/wezterm/foot/
# alacritty/ghostty clients — keep it for those.
set -g set-clipboard on
# Idempotent: replaces on reload (the old `-ag`/`-as` appends grew one entry
# on every source-file — the live server had ~40 duplicate overrides).
# `*:clipboard` is what enables the write even though xterm-256color's
# terminfo does not advertise the `Ms` capability.
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,*:clipboard'
set -g terminal-overrides 'linux*:AX@,*:RGB,*:Tc'

# tmux-yank: keep its y/mouse copy bindings, but the copy itself is delivered
# by tmux's native OSC 52 write (independent of any pipe command), so the pipe
# target is a no-op — this stops tmux-yank from picking wl-copy/xclip, which
# exist on this headless VPS but can never succeed.
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_with_mouse on
set -g @yank_action 'copy-pipe-and-cancel'
set -g @override_copy_command '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'

# --- DEFAULT COLORS (Graphite panes + matching bottom bar) ---
# Theme helper: ttheme <theme> [theme(default)|transparent|dark|inverse]
# Neutral transparent theme: ttheme transparent
set -g status-style 'bg=#141414,fg=#d0d0d0'
set -g status-justify centre
set -g status on
set -g status-left-length 60
set -g status-right-length 140
set -g status-interval 2

# Single-line status bar: session, windows, and window-management reminders.
# NOTE: status-format[0] is authoritative when present.
# Active window = light-grey PILL with ROUNDED caps, not chevrons: the caps are Nerd Font
# half-circle glyphs U+E0B6 (left) / U+E0B4 (right) drawn as fg=pill,bg=bar, so the active
# window reads as a rounded (___) blob. Requires a Nerd Font (both are present in
# JetBrainsMonoNerdFont and MesloLGS NF as ple-left/right_half_circle_thick). The previous
# chevrons were U+E0B2/U+E0B0 (hard dividers) - swap back if round glyphs render as tofu.
# bg=default in the wings = "keep the bar's bg", so it blends on any bar style.
# The W: comma split is bracket-naive, so the inactive half must stay commaless.
# Leading/trailing spaces = left/right inset for rounded terminal corners, which
# clip the first/last glyphs of the bar. NOTE: the right inset must be TRAILING
# spaces (spaces after #[align=right] would sit left of the content, not pad it) —
# don't let a whitespace-trimming editor eat them. status-left/status-right are
# inert here because status-format[0] is authoritative.
set -g status-format[0] '#[align=left]   #S #{W: #I:#W ,#[nobold]#[fg=#d0d0d0,bg=default]#[bg=#d0d0d0,fg=#101010,bold] #I:#W #[nobold]#[fg=#d0d0d0,bg=default]#[default]}#[align=right]#(~/.tmux/scripts/git-pane-status.sh "#{pane_id}" "#{pane_current_path}" short) #{pane_current_command}#{?client_prefix, PREFIX,}  '
set -gu status-format[1]
set -g status-left ''
set -g status-right ''

setw -g window-status-style 'bg=#141414,fg=#a8a8a8'
setw -g window-status-current-style 'bg=#141414,fg=#f0f0f0,bold'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' (#I:#W) '

set -g window-style 'bg=#141414,fg=#8a8f94'
set -g window-active-style 'bg=#141414,fg=#b8bcc0'

# Invisible pane frame: glyph fg matches the pane bg; tmux keeps only its layout gutter.
# Floating top label: light-grey chip behind index+id when focused; unfocused = dim grey. No label background.
# ROUNDED CAPS REVERTED 2026-09-12: U+E0B6/U+E0B4 caps on this 1-line border row (a row
# sandwiched between two panes, unlike the status bar which sits on the screen edge) looked
# skewed / crossed the pane boundary on the user's client. tmux side was verified correct
# (label is left-aligned at xoff+2, and all four glyphs have wcwidth()==1), so this is a
# font/terminal rendering issue with the Powerline-Extra range.
set -g pane-border-style 'fg=#141414,bg=#141414'
set -g pane-active-border-style 'fg=#141414,bg=#141414'
set -g pane-border-lines single
set -g pane-border-status top
# To retry the rounded pane chip: give the terminal a cell a hair taller than the font's
# line box (alacritty [font] line_height ~1.05) so full-height glyph ink stops bleeding
# into the panes above/below, then swap the active branch below for:
#   #{?pane_active,#[nobold]#[fg=#d0d0d0,bg=#141414]#[bg=#d0d0d0,fg=#101010,bold] #{pane_index} #{pane_id} #[nobold]#[fg=#d0d0d0,bg=#141414]#[fg=#b8bcc0,bg=#141414]#[bold],#[fg=#303030,bg=#141414] #{pane_index} #{pane_id}#[fg=#b8bcc0,bg=#141414]#[bold]}
# Measured ink in the topmost/bottommost pixel row of the cell (60 sample cols, JetBrains
# Mono NF): chevrons E0B0/E0B2 = 4 cols (thin tip, invisible if it bleeds), filled caps
# E0B4/E0B6 = 22 cols (a blatant grey bar when it bleeds). That is why only the cap version
# looked broken, and only on the pane row (the status bar sits at the screen edge).
set -g pane-border-format '#{?pane_active,#[bg=#d0d0d0]#[fg=#101010]#[bold] #{pane_index} #{pane_id} #[default]#[fg=#b8bcc0]#[bold],#[fg=#303030] #{pane_index} #{pane_id}} · #{pane_title} #{b:pane_current_path} #(~/.tmux/scripts/git-pane-status.sh "#{pane_id}" "#{pane_current_path}" branch) #[default]'

set -g message-style 'bg=#222222,fg=#c6cacf'

# --- KEYBINDS ---
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes keeping current path
bind | split-window -h -c "#{pane_current_path}" \; refresh-client -S
bind - split-window -v -c "#{pane_current_path}" \; refresh-client -S

# Vim-style pane navigation (force immediate status refresh)
bind h select-pane -L \; refresh-client -S
bind j select-pane -D \; refresh-client -S
bind k select-pane -U \; refresh-client -S
bind l select-pane -R \; refresh-client -S

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window keeping current path
bind c new-window -c "#{pane_current_path}" \; refresh-client -S

# Session picker: full-screen classic launcher (xtmux-classic).
# -B + 100%x100% with no border style: the launcher owns the palette and keeps
# the details pane hidden until Ctrl-/. Legacy compact modes remain on prefix g/G.
unbind s
bind s display-popup -B -E -x 0 -y 0 -w 100% -h 100% "$HOME/.local/bin/xtmux-classic"
# Sidebar navigator; prefix v was free when installed.
bind v display-popup -E -x 0 -y 0 -w 40% -h 75% -s "bg=#222222@200,fg=#d7dbdd" -S "fg=#858d91,bg=#222222" 'XTMUX_NAV_WIDTH=$(tput cols) $HOME/.local/bin/tmux-session-picker nav'
bind g display-popup -E -w 99% -h 97% -s "bg=#141414,fg=#b8bcc0" -S "fg=#6f767d,bg=#141414" "TMUX_PICKER_MODE=compact-wrap $HOME/.local/bin/tmux-session-picker"
bind G display-popup -E -w 99% -h 97% -s "bg=#141414,fg=#b8bcc0" -S "fg=#6f767d,bg=#141414" "TMUX_PICKER_MODE=compact-nowrap $HOME/.local/bin/tmux-session-picker"
# Agent HUD: glanceable live view of @agent_state across all sessions.
# Popup redraws every 2s; any key closes. Jumping is prefix s's job.
bind A display-popup -E -w 76% -h 34% -s "bg=#141414,fg=#b8bcc0" -S "fg=#6f767d,bg=#141414" "$HOME/.tmux/scripts/agent-hud.sh"

bind S choose-tree -Zs

# --- PLUGINS (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'new-session'

# tmux sidebar for coding agents (Amp, Claude Code, Codex, OpenCode)
# Open: prefix o -> s   Toggle: prefix o -> t   Focus sidebar: prefix o -> e
# Disabled 2026-07-22 — the opensessions-server was writing an unbounded debug log
# to /tmp/opensessions-debug.log (245 MB/day, 7.3 GB in a month), driving the host
# into swap exhaustion. Plugin dir was already gone from disk; only an orphan PID
# was keeping it alive. Re-enable only after upstream fixes the debug logger or
# after wiring an explicit toggle (@opensessions_debug 0 if such a knob exists).
# set -g @plugin 'Ataraxy-Labs/opensessions'

run '~/.tmux/plugins/tpm/tpm'

# --- VI COPY-MODE ---
# Copy = copy-pipe-and-cancel through the helper script, which on this VPS
# delivers via, in order: xclip over SSH X11 forwarding (works with GNOME
# Terminal), the reverse-tunnel clipboard bridge, then tmux OSC 52 as the
# fallback for terminals that support it. VTE/GNOME Terminal does NOT apply
# OSC 52 (verified in vte src/vteseq.cc: VTE_OSC_XTERM_SET_XSELECTION falls
# through to the ignored default), so xclip/bridge are the real path here.
bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'
bind -T copy-mode-vi v                 send-keys -X begin-selection
bind -T copy-mode-vi C-v               send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape            send-keys -X clear-selection

# Mouse drag: drag in a normal pane enters copy-mode; releasing copies.
# Verified from tmux source: mouse_any_flag is only set when the *pane*
# (vim/less, ...) has mouse reporting on, so plain-shell drags take the
# copy-mode -M branch as intended.
bind -T root MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -M'
# Bind both tables: tmux may use copy-mode even when mode-keys is vi during mouse events.
bind -T copy-mode-vi MouseDrag1Pane    select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'
bind -T copy-mode    MouseDrag1Pane    select-pane \; send-keys -X begin-selection
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '$HOME/.tmux/scripts/copy-to-clipboard.sh "#{client_tty}"'

# Paste from tmux buffer (in normal mode)
bind p paste-buffer

# --- CHECK CLIPBOARD CONFIGURATION ---
# prefix-? shows real state: mouse, set-clipboard, the attached client's
# terminal and its features (clipboard must be listed for OSC 52 to fire).
bind ? display-message -p \
  "Mouse: #{?mouse,on,off} | set-clipboard: #{?set-clipboard,on,off} | term: #{client_termname} | features: #{client_termfeatures} | DISPLAY: #{DISPLAY:-unset} | paste: Ctrl+V"

# --- CLIPBOARD SELF-TEST ---
# prefix C-t: copies a timestamped marker to the client clipboard via OSC 52.
# Then Ctrl+V in GNOME Terminal should paste "tmux-clipboard-OK <time>".
bind C-t run-shell -b 'printf "tmux-clipboard-OK %s" "$(date +%H:%M:%S)" | $HOME/.tmux/scripts/copy-to-clipboard.sh; tmux display-message "Clipboard test sent — paste it with Ctrl+V. (If empty: no DISPLAY/bridge; see prefix-?)"'

# --- STATUS BAR REFRESH HOOKS (focus-aware, aggressive) ---
set-hook -g after-select-pane 'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'
set-hook -g client-session-changed 'refresh-client -S'
set-hook -g pane-focus-in 'refresh-client -S'
set-hook -g after-split-window 'refresh-client -S'
set-hook -g after-new-window 'refresh-client -S'
set-hook -g pane-exited 'refresh-client -S'

set -g extended-keys-format csi-u

# xtmux-view: rich Markdown overlay for the pane under the current key context
bind m run-shell 'xtmux-view "#{pane_id}"'
